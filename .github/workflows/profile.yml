name: Профиль

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Карточки
        run: python3 scripts/cards.py "${{ github.repository_owner }}" cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Сохранить
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          # main мог уйти вперёд (ручная правка во время прогона) — догоняем перед push
          git diff --cached --quiet || { git commit -m "Обновить карточки"; git pull --rebase; git push; }

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1f2328&color_dots=#eff2f5,#d1d9e0,#9198a1,#59636e,#1f2328
            dist/snake-dark.svg?color_snake=#f0f6fc&color_dots=#161b22,#30363d,#6e7681,#b1bac4,#f0f6fc

      - name: Убрать полосу под змейкой
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist   # snk пишет из докера от root
          python3 scripts/snake-trim.py dist/*.svg

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
